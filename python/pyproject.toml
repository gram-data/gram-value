[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gram-value"
version = "0.2.0"
description = "The data values of the gram notation: kinds, equality, canonical text, known-tag interpretation and mapping to Python values"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/gram-data/gram-value"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "tree-sitter>=0.25",
    "tree-sitter-gram==0.7.0",
]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/gram_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
