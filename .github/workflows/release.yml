# Publishes one package when a package tag is pushed (ADR-007): rust-vX.Y.Z, typescript-vX.Y.Z, python-vX.Y.Z,
# go/vX.Y.Z, or the plain vX.Y.Z for Swift.
# The publish jobs wait for an approval in the protected `release` environment. See RELEASING.md.
name: Release

on:
  push:
    tags:
      - "rust-v*"
      - "typescript-v*"
      - "python-v*"
      - "go/v*"
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag matches its package version, and the packages share the corpus's major.minor
        id: tag
        run: python3 scripts/check-release.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for job in rust typescript python go swift swift-linux corpus; do
            c=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name==\"$job\")] | sort_by(.completed_at) | last | .conclusion")
            echo "CI job $job: $c"
            [ "$c" = "success" ] || exit 1
          done

  publish-rust:
    needs: verify
    if: needs.verify.outputs.package == 'rust'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Already published?
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "gram-value-release" "https://crates.io/api/v1/crates/gram-value/$VERSION")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: steps.exists.outputs.published != 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
      - name: Verify from crates.io
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "gram-value-release" "https://crates.io/api/v1/crates/gram-value/$VERSION")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "gram-value $VERSION is not visible on crates.io"; exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-typescript:
    needs: verify
    if: needs.verify.outputs.package == 'typescript'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # The registry is asked with curl, without the (placeholder or real) auth token that setup-node writes.
      - name: Already published?
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@gram-data%2fvalue/$VERSION")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.exists.outputs.published != 'true'
      - name: Publish (trusted publishing; NPM_TOKEN only for the first release)
        if: steps.exists.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      # npm says "your package is being processed and may take a few minutes": the first publish took about five.
      - name: Verify from npm
        run: |
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@gram-data%2fvalue/$VERSION")
            [ "$code" = 200 ] && exit 0
            sleep 20
          done
          echo "@gram-data/value $VERSION is not visible on npm after 15 minutes"; exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-python:
    needs: verify
    if: needs.verify.outputs.package == 'python'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Already published?
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/gram-value/$VERSION/json")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.exists.outputs.published != 'true'
        working-directory: python
        run: uv build
      - name: Publish (trusted publishing)
        if: steps.exists.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
      - name: Verify from PyPI
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/gram-value/$VERSION/json")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "gram-value $VERSION is not visible on PyPI"; exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-go:
    needs: verify
    if: needs.verify.outputs.package == 'go'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Go has no registry to publish to: the tag is the release. Ask the Go module proxy to fetch it,
      # then check that it is served.
      - name: Ask the Go module proxy for the version, and verify it
        run: |
          url="https://proxy.golang.org/github.com/gram-data/gram-value/go/@v/v$VERSION.info"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "github.com/gram-data/gram-value/go v$VERSION is not served by proxy.golang.org"; exit 1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-swift:
    needs: verify
    if: needs.verify.outputs.package == 'swift'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # SwiftPM has no registry: the tag is the release. Check that a package can resolve the tagged version.
      - name: Resolve the tagged version as a dependency
        run: |
          mkdir consumer && cd consumer
          mkdir -p Sources/Consumer
          echo 'public let ok = true' > Sources/Consumer/Consumer.swift
          cat > Package.swift <<EOF
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
              name: "Consumer",
              platforms: [.macOS(.v13)],
              dependencies: [.package(url: "https://github.com/gram-data/gram-value", exact: "$VERSION")],
              targets: [.target(name: "Consumer", dependencies: [.product(name: "GramValue", package: "gram-value")])]
          )
          EOF
          swift build
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
