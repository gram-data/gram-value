name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-rust
          path: rust/target/conformance-results.gram
          if-no-files-found: error

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-typescript
          path: typescript/target/conformance-results.gram
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-python
          path: python/target/conformance-results.gram
          if-no-files-found: error

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-go
          path: go/target/conformance-results.gram
          if-no-files-found: error

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the library (the root package, no dependencies)
        run: swift build
      - name: Conformance runner and unit tests
        working-directory: swift/Tests
        run: swift test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-swift
          path: swift/Tests/target/conformance-results.gram
          if-no-files-found: error

  swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - name: Conformance runner and unit tests
        working-directory: swift/Tests
        run: swift test

  corpus:
    needs: [rust, typescript, python, go, swift]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache the gram binary
        id: gram-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/gram
          key: gram-${{ runner.os }}-0.7.0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gram-cache.outputs.cache-hit != 'true'
      - name: Install gram
        if: steps.gram-cache.outputs.cache-hit != 'true'
        run: cargo install gram-data --version 0.7.0 --locked
      - run: gram lint --strict conformance/
      - run: python3 scripts/gen-mapping-docs.py --check
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - run: gram lint --strict results/
      - run: python3 scripts/test_gen_parity_matrix.py
      - run: python3 scripts/test_check_release.py
      - run: python3 scripts/check-release.py
      - name: Parity matrix
        run: |
          python3 scripts/gen-parity-matrix.py --out parity.md \
            rust=results/results-rust/conformance-results.gram \
            typescript=results/results-typescript/conformance-results.gram \
            python=results/results-python/conformance-results.gram \
            go=results/results-go/conformance-results.gram \
            swift=results/results-swift/conformance-results.gram
      - name: Publish the matrix to the job summary
        if: ${{ !cancelled() }}
        run: cat parity.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: parity-matrix
          path: parity.md
