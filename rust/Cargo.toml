[package]
name = "gram-value"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "The data values of the gram notation: kinds, equality, canonical text and known-tag interpretation"
license = "MIT"
repository = "https://github.com/gram-data/gram-value"
homepage = "https://github.com/gram-data/gram-value/tree/main/rust#readme"
documentation = "https://docs.rs/gram-value"
keywords = ["gram", "graph", "values"]
categories = ["data-structures", "parsing"]
readme = "README.md"
exclude = ["tests/", "skips.gram", "target/"]

[dependencies]

[dev-dependencies]
tree-sitter = "0.25"
tree-sitter-gram = "=0.7.0"
